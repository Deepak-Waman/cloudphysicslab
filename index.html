<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dr Nimbus — Human Voice Demo</title>

<style>
body {
  background:#0b1320;
  color:#e6eef7;
  font-family:system-ui;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  height:100vh;
  margin:0;
}

.container {
  text-align:center;
}

.kalam-char {
  width:220px;
  margin-bottom:20px;
  animation:breathe 5s ease-in-out infinite;
  transform-origin:center bottom;
}

@keyframes breathe {
  0%,100% { transform:scale(1,1); }
  50% { transform:scale(1.01,0.99); }
}

button {
  padding:12px 18px;
  margin:6px;
  border:none;
  background:#7ec8e3;
  color:#000;
  font-weight:600;
  cursor:pointer;
}

select {
  padding:8px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="container">

<!-- ===== HUMAN SCIENTIST SVG ===== -->
<svg class="kalam-char" id="char" viewBox="0 0 260 420">

  <ellipse cx="130" cy="395" rx="60" ry="12" fill="rgba(0,0,0,0.4)" />

  <!-- Legs -->
  <path d="M100 250 L90 360 L120 360 L125 250 Z" fill="#0b0f18"/>
  <path d="M160 250 L165 360 L195 360 L180 250 Z" fill="#0b0f18"/>

  <rect x="85" y="360" width="40" height="10" rx="3" fill="#111"/>
  <rect x="165" y="360" width="40" height="10" rx="3" fill="#111"/>

  <!-- Shirt -->
  <rect x="105" y="150" width="50" height="110" fill="#fff"/>

  <!-- Tie -->
  <polygon points="130,150 120,200 140,200" fill="#1a3a6e"/>
  <rect x="126" y="200" width="8" height="40" fill="#1a3a6e"/>

  <!-- Lab coat -->
  <path d="M80 150 L60 300 L90 300 L110 170 L150 170 L170 300 L200 300 L180 150 Z"
        fill="#f5f8fb" stroke="#d6dde7"/>

  <!-- Arms -->
  <path d="M80 160 Q50 190 70 230 Q90 220 105 180 Z" fill="#f5f8fb"/>
  <path d="M180 160 Q210 190 190 230 Q170 220 155 180 Z" fill="#f5f8fb"/>

  <ellipse cx="70" cy="235" rx="10" ry="8" fill="#8b5a2b"/>
  <ellipse cx="190" cy="235" rx="10" ry="8" fill="#8b5a2b"/>

  <!-- Neck -->
  <rect x="118" y="135" width="24" height="20" rx="6" fill="#8b5a2b"/>

  <!-- Head -->
  <ellipse cx="130" cy="100" rx="42" ry="50" fill="#8b5a2b"/>

  <!-- Hair -->
  <path d="M90 90 Q130 40 170 90 Q150 70 130 70 Q110 70 90 90 Z"
        fill="#d0d0d0"/>

  <!-- Glasses -->
  <circle cx="115" cy="105" r="16" stroke="#111" stroke-width="2" fill="transparent"/>
  <circle cx="145" cy="105" r="16" stroke="#111" stroke-width="2" fill="transparent"/>

  <!-- Eyes -->
  <circle cx="115" cy="105" r="5" fill="#000"/>
  <circle cx="145" cy="105" r="5" fill="#000"/>

  <!-- Nose -->
  <path d="M130 110 Q128 120 130 125 Q132 120 130 110 Z" fill="#6e4420"/>

  <!-- Mouth -->
  <path id="mouth" d="M115 135 Q130 145 145 135" stroke="#5a3010" stroke-width="2"/>

</svg>

<button onclick="speak()">🎙 Speak</button>
<button onclick="stop()">■ Stop</button>

<br>

<select id="voices"></select>

</div>

<script>

let voices = [];
let speaking = false;
let mouthTimer = null;

const text = `My dear friends. Science is not just knowledge. It is curiosity. 
It is imagination. And above all, it is the courage to ask questions.`;

// Load voices
function loadVoices() {
  voices = speechSynthesis.getVoices();
  const sel = document.getElementById('voices');
  sel.innerHTML = '';

  voices.forEach((v,i)=>{
    if(v.lang.startsWith('en')){
      const opt = document.createElement('option');
      opt.value = i;
      opt.textContent = v.name;
      sel.appendChild(opt);
    }
  });
}

speechSynthesis.onvoiceschanged = loadVoices;
setTimeout(loadVoices, 500);

// Pick best voice
function pickVoice(){
  const sel = document.getElementById('voices');
  if(sel.value) return voices[sel.value];

  return voices.find(v=>v.name.includes('Natural')) ||
         voices.find(v=>v.lang==='en-IN') ||
         voices.find(v=>v.lang==='en-GB') ||
         voices[0];
}

// Human-like speaking
function speak(){

  stop();

  const sentences = text.match(/[^.!?]+[.!?]+/g) || [text];

  let i=0;

  function next(){

    if(i>=sentences.length){
      stopMouth();
      return;
    }

    const u = new SpeechSynthesisUtterance(sentences[i]);

    const v = pickVoice();
    if(v) u.voice = v;

    u.rate = 0.9 + Math.random()*0.1;
    u.pitch = 1.05;

    u.onstart = startMouth;

    u.onend = ()=>{
      i++;
      setTimeout(next, 250 + Math.random()*200);
    };

    speechSynthesis.speak(u);
  }

  next();
}

// Stop
function stop(){
  speechSynthesis.cancel();
  stopMouth();
}

// ===== Mouth animation =====
function startMouth(){
  const m = document.getElementById('mouth');
  mouthTimer = setInterval(()=>{
    m.setAttribute('d',
      Math.random()>0.5
      ? "M115 135 Q130 155 145 135"
      : "M115 135 Q130 145 145 135"
    );
  },120);
}

function stopMouth(){
  clearInterval(mouthTimer);
  document.getElementById('mouth')
    .setAttribute('d',"M115 135 Q130 145 145 135");
}

</script>

</body>
</html>
